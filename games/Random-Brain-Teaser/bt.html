<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Brain Teaser Generator</title>
    <link rel="stylesheet" href="bt.css">
</head>
<body>
    <div class="container">
        <h1>Random Brain Teaser</h1>
        <div id="question"></div>
        <div id="options">
            <button class="option" id="option1"></button>
            <button class="option" id="option2"></button>
            <button class="option" id="option3"></button>
            <button class="option" id="option4"></button>
        </div>
        <button id="submitBtn">Submit Answer</button>
        <div id="feedback"></div>
        <div id="score">Score: 0</div>
        <button id="nextBtn">Next Question</button>
    </div>
    <script src="brain.js"></script>
</body>
</html>
